<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="savedPostsTitle">پست‌های ذخیره‌شده · افزونه متمم</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <script src="../shared/theme.js"></script>
  <script src="../shared/i18n.js"></script>
  <link rel="stylesheet" href="saved-posts.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4h11a2 2 0 0 1 2 2v14l-5-3-5 3V6a2 2 0 0 0-2-2H6z"/>
            <path d="M6 4a2 2 0 0 0-2 2v13"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 data-i18n="savedPostsHeading">پست‌های ذخیره‌شده</h1>
          <span class="brand-sub" data-i18n="brandSub">افزونه متمم</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="export-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12M8 11l4 4 4-4M5 21h14"/>
          </svg>
          <span data-i18n="export">خروجی</span>
        </button>
        <button id="import-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V3M8 7l4-4 4 4M5 21h14"/>
          </svg>
          <span data-i18n="import">ورودی</span>
        </button>
        <input type="file" id="import-file" accept=".json" hidden>
        <button id="lang-toggle" class="lang-toggle" type="button" data-i18n-aria="langAria"></button>
        <button id="theme-toggle" class="theme-toggle" type="button" data-i18n-aria="themeAria"></button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" id="search-input" class="search-input" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      <button id="search-clear" class="search-clear" type="button" data-i18n-aria="searchClearAria" style="display: none;">×</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="toRead">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H11v16H4.5A2.5 2.5 0 0 0 2 21.5z"/>
          <path d="M22 5.5A2.5 2.5 0 0 0 19.5 3H13v16h6.5a2.5 2.5 0 0 1 2.5 2.5z"/>
        </svg>
        <span data-i18n="toRead">برای خواندن</span>
        <span class="count" id="toread-tab-count">0</span>
      </button>
      <button class="tab-btn" data-tab="read">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.2 7 10 18.2 4.8 13"/>
        </svg>
        <span data-i18n="read">خوانده‌شده</span>
        <span class="count" id="read-tab-count">0</span>
      </button>
      <button class="tab-btn" data-tab="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 20V10M11 20V4M18 20v-7"/>
        </svg>
        <span data-i18n="stats">آمار</span>
      </button>
    </div>

    <div id="label-filter-bar" class="label-filter-bar" style="display: none;"></div>

    <div class="content">
      <div id="list-view">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p data-i18n="loadingPosts">در حال بارگذاری پست‌ها…</p>
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7a2 2 0 0 1 2-2h7l2 3h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
            </svg>
          </div>
          <h2 id="empty-state-title" data-i18n="noPostsYetTitle">هنوز پستی ذخیره نشده</h2>
          <p id="empty-state-desc" data-i18n="noPostsYetDesc">پست‌ها را از وبلاگ ذخیره کنید تا اینجا نمایش داده شوند.</p>
        </div>

        <div id="posts-list" class="posts-list" style="display: none;"></div>

        <div id="pagination" class="pagination" style="display: none;"></div>
      </div>

      <div id="stats-view" class="stats-view" style="display: none;">
        <div class="stats-month-nav">
          <button id="stats-prev" class="pagination-btn" type="button" data-i18n="statsPrev" data-i18n-aria="statsPrev">← ماه قبل</button>
          <span id="stats-month-label" class="stats-month-label"></span>
          <button id="stats-next" class="pagination-btn" type="button" data-i18n="statsNext" data-i18n-aria="statsNext">ماه بعد →</button>
        </div>

        <div id="stats-summary" class="stats-summary"></div>

        <div class="stats-legend">
          <span><span class="swatch read"></span><span data-i18n="statsLegendRead">خوانده‌شده</span></span>
          <span><span class="swatch unread"></span><span data-i18n="statsLegendUnread">برای خواندن</span></span>
        </div>

        <div id="stats-trend-title" class="stats-trend-title"></div>
        <div id="stats-chart" class="stats-chart"></div>

        <div id="stats-empty" class="stats-empty" style="display: none;" data-i18n="statsEmpty">این ماه پستی ذخیره نشده است.</div>
      </div>
    </div>
  </div>

  <div id="notification" class="notification"></div>

  <script src="../shared/utils.js"></script>
  <script src="saved-posts.js"></script>
</body>
</html>
